[project]
name = "QuantPy"
version = "0.1.0"
description = "A python library for finance"
readme = "README.md"
requires-python = ">=3.11"


dependencies = [
    "numpy==2.4.1",
    "matplotlib==3.10.8",
    "yfinance==1.1.0",
    "pandas==3.0.0",
    "scipy==1.17.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
